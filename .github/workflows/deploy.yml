name: Deploy to AWS Lambda

on:
  push:
    branches: [main]

env:
  AWS_REGION: ca-central-1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Installation des dépendances de production
        run: npm ci --omit=dev

      - name: Création du ZIP de déploiement
        run: |
          zip -r function.zip . \
            --exclude "*.git*" \
            --exclude ".env" \
            --exclude "*.md" \
            --exclude "pack.js" \
            --exclude "function.zip" \
            --exclude "scratch/*" \
            --exclude "view/*" \
            --exclude "auth/*"
          echo "Taille du ZIP : $(du -sh function.zip | cut -f1)"

      - name: Configuration des credentials AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Déploiement sur Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://function.zip

      - name: Attendre la fin de la mise à jour
        run: |
          aws lambda wait function-updated \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }}
          echo "Lambda mise à jour avec succès"
